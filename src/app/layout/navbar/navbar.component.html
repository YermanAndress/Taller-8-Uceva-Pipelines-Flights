<header class="site-header">
  <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3">
    <a class="brand" routerLink="/inicio" aria-label="SkyRoute, ir al inicio">
      <span class="brand-icon">
        <i class="bi bi-airplane-engines-fill"></i>
      </span>
      <span>SkyRoute</span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      @for (item of items; track item.url) {
        <a
          class="nav-item"
          [routerLink]="item.url"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.url === '/inicio' }"
        >
          <i [class]="'bi bi-' + item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
</header>
